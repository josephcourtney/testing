[project]
name = "testing-reference"
version = "0.1.0"
description = "Runnable reference project for the testing guidance repository"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
testing-reference = "testing_reference.cli:main"
testpolicy = "testing_policy.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "pytest-json-report>=1.5",
  "ruff>=0.9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/testing_reference", "src/testing_policy"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = ["--strict-config", "--strict-markers", "-ra"]
xfail_strict = true
markers = [
  "unit: Small local structural scope.",
  "component: Coherent subsystem structural scope.",
  "integration: Real boundary semantics structural scope.",
  "system: Assembled product structural scope.",
  "acceptance: Stakeholder-relevant purpose.",
  "regression: Protects established behavior or a learned failure mode.",
  "contract: Producer-consumer or compatibility purpose.",
  "smoke: Small critical-capability selection.",
  "compatibility: Supported environment or artifact purpose.",
  "property_based: Generated invariant technique.",
  "fuzz: Generated or mutated adversarial-input technique.",
  "filesystem: Uses real filesystem semantics.",
  "process: Crosses a process boundary.",
  "slow: Excluded from the fast selection.",
  "quarantined: Excluded from trusted evidence under an owned, expiring record.",
  "requirement(id): Links evidence to a declared responsibility.",
]

[tool.coverage.run]
source = ["testing_reference"]
branch = true
parallel = false

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
