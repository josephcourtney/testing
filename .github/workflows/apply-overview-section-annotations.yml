name: Apply Overview section annotations

on:
  push:
    branches:
      - annotate-testing-guidance-comments

permissions:
  contents: write

jobs:
  annotate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: annotate-testing-guidance-comments
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python scripts/annotate_overview_sections.py
      - run: rm scripts/annotate_overview_sections.py .github/workflows/apply-overview-section-annotations.yml
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Overview.md scripts/annotate_overview_sections.py .github/workflows/apply-overview-section-annotations.yml
          git commit -m "Annotate Overview sections proposed for relocation"
          git push
