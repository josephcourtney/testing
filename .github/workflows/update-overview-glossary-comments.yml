name: Update Overview glossary comments

on:
  push:
    branches:
      - annotate-testing-guidance-comments

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: annotate-testing-guidance-comments
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python scripts/update_overview_glossary_comments.py
      - run: rm scripts/update_overview_glossary_comments.py .github/workflows/update-overview-glossary-comments.yml
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Overview.md glossary.md scripts/update_overview_glossary_comments.py .github/workflows/update-overview-glossary-comments.yml
          git commit -m "Update Overview comments for extracted glossary"
          git push
