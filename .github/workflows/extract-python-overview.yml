name: Extract Python guidance from Overview

on:
  push:
    branches:
      - annotate-testing-guidance-comments

permissions:
  contents: write

jobs:
  extract:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: annotate-testing-guidance-comments
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python scripts/extract_python_overview.py
      - run: rm scripts/extract_python_overview.py .github/workflows/extract-python-overview.yml
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Overview.md python_testing.md scripts/extract_python_overview.py .github/workflows/extract-python-overview.yml
          git commit -m "Extract Python-specific guidance from Overview"
          git push

# This workflow removes itself after the one-time extraction.
