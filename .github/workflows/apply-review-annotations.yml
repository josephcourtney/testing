name: Apply review annotations

on:
  push:
    branches:
      - annotate-testing-guidance-comments

permissions:
  contents: write

jobs:
  annotate:
    if: ${{ !contains(github.event.head_commit.message, '[annotations applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: annotate-testing-guidance-comments
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Add non-rendered review comments
        run: python scripts/apply_review_annotations.py

      - name: Remove one-time helpers
        run: |
          rm scripts/apply_review_annotations.py
          rm .github/workflows/apply-review-annotations.yml
          rmdir scripts 2>/dev/null || true
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true

      - name: Verify and commit annotation-only changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Annotate original testing guidance [annotations applied]'
          git push origin HEAD:annotate-testing-guidance-comments
