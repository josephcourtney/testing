name: Clean up Python extraction

on:
  push:
    branches:
      - annotate-testing-guidance-comments

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: annotate-testing-guidance-comments
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python scripts/cleanup_python_extraction.py
      - run: rm scripts/cleanup_python_extraction.py .github/workflows/cleanup-python-extraction.yml
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Overview.md python_testing.md scripts/cleanup_python_extraction.py .github/workflows/cleanup-python-extraction.yml
          git commit -m "Clean up Python guidance extraction"
          git push
