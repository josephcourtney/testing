# Illustrative Python testing configuration.
#
# Replace package names, tool versions, warning filters, paths, and marker
# declarations. Keep partial and complete evidence commands separate. Define
# numeric gates through L3-T11 rather than copying thresholds blindly.

[dependency-groups]
dev = [
  "hypothesis>=6",
  "pip-audit>=2",
  "pytest>=9",
  "pytest-asyncio>=1",
  "pytest-cov>=7",
  "pytest-randomly>=4",
  "pytest-socket>=0.8",
  "pytest-xdist>=3",
  "ruff>=0.15",
]

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
addopts = [
  "--strict-markers",
  "--strict-config",
  "-ra",
  "--disable-socket",
]
xfail_strict = true

filterwarnings = [
  'error::DeprecationWarning:package_name\.',
]

markers = [
  # Primary structural scope
  "unit: Small local boundary with highly localizing failures.",
  "component: Coherent subsystem through a supported interface.",
  "integration: Evidence depends on real semantics across a boundary.",
  "system: Assembled product through a user- or operator-visible boundary.",

  # Purpose
  "acceptance: Stakeholder-visible acceptance condition.",
  "regression: Protects established behavior or a learned failure mode.",
  "sanity: Narrow plausibility check before broader evaluation.",
  "contract: Producer-consumer or compatibility obligation.",
  "smoke: Small critical-capability selection.",
  "compatibility: Supported version, platform, artifact, or consumer behavior.",
  "security: Threat-relevant behavior or control.",
  "privacy: Privacy obligation.",
  "performance: Performance or capacity claim.",
  "data_quality: Data integrity, freshness, or distribution claim.",
  "observability: Operator signal or diagnostic claim.",
  "accessibility: Accessibility obligation.",
  "usability: User task or comprehension claim.",
  "resilience: Degraded-operation claim.",
  "recovery: Rollback, restart, restoration, or failover claim.",

  # Technique
  "property_based: Generated invariant testing.",
  "stateful: Generated state-machine testing.",
  "model_based: Testing against an explicit model.",
  "differential: Comparison between implementations or versions.",
  "metamorphic: Relation across transformed inputs or outputs.",
  "fuzz: Malformed, adversarial, random, or coverage-guided inputs.",
  "snapshot: Canonical stored-artifact comparison.",
  "fault_injection: Controlled failure introduction.",
  "chaos: Hypothesis-driven fault experiment.",

  # Resource and execution
  "filesystem: Uses real filesystem semantics.",
  "process: Crosses a process boundary.",
  "db: Uses a database engine.",
  "network: Uses a network boundary.",
  "clock: Depends on clock semantics.",
  "configuration: Exercises configuration-dependent behavior.",
  "environment: Depends on a declared environment.",
  "hardware: Depends on specific hardware.",
  "slow: Excluded from the fastest workflow.",
  "destructive: Mutates an isolated resource.",
  "quarantined: Not trusted as gating evidence.",
]

[tool.coverage.run]
source = ["package_name"]
branch = true
parallel = true

[tool.coverage.report]
show_missing = false
skip_covered = true

# Collect canonical coverage only in a named complete-evidence command, for
# example:
#
#   pytest -m "not quarantined" \
#     --cov=package_name --cov-branch \
#     --cov-report=term-missing --cov-report=xml
#
# Partial developer runs should use --no-cov or separate output paths.
